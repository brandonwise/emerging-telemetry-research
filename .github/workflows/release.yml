name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --frozen --extra dev
      - name: Verify release contracts
        run: |
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          make check
          make audit
      - name: Build and smoke-test distributions
        run: |
          uv build --clear
          uv run python scripts/smoke_wheel.py
          uv --preview-features sbom-export --quiet export --frozen \
            --format cyclonedx1.5 --no-dev \
            --output-file dist/outcome-radar.cdx.json
          cd dist
          sha256sum outcome_radar-* outcome-radar.cdx.json > SHA256SUMS
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/outcome_radar-* \
            dist/outcome-radar.cdx.json dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Outcome Radar $GITHUB_REF_NAME"
