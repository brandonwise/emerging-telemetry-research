name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.1
          uv sync --frozen --extra dev
      - name: Verify release contracts
        run: |
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          make check
          make audit
      - name: Build and smoke-test distributions
        run: |
          uv build --clear
          uv run python scripts/smoke_wheel.py
          uv --preview-features sbom-export --quiet export --frozen \
            --format cyclonedx1.5 --no-dev \
            --output-file dist/emerging-telemetry-research.cdx.json
          cd dist
          sha256sum emerging_telemetry_research-* emerging-telemetry-research.cdx.json > SHA256SUMS
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/emerging_telemetry_research-* \
            dist/emerging-telemetry-research.cdx.json dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Emerging Telemetry Research $GITHUB_REF_NAME"
