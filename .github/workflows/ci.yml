name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Pin to a reviewed commit SHA before production.
      - uses: actions/setup-python@v5 # Pin to a reviewed commit SHA before production.
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_repo.py
      - run: ruff check .
      - run: mypy apps packages
      - run: pytest --cov=apps --cov=packages --cov-report=term-missing
