name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.10
          uv sync --frozen --extra dev
      - name: Validate contracts and security gates
        run: uv run python scripts/validate_repo.py
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy apps packages scripts/run_acceptance.py scripts/verify_restore.py
      - name: Test
        env:
          RADAR_TEST_DATABASE_URL: postgresql://radar:radar_test_password@127.0.0.1:5432/radar_test
        run: uv run pytest --cov=apps --cov=packages --cov-report=term-missing
      - name: Frozen acceptance demonstration
        run: uv run python scripts/run_acceptance.py --output "$RUNNER_TEMP/radar-acceptance"
      - name: Immutable evidence restore demonstration
        run: uv run python scripts/verify_restore.py --output "$RUNNER_TEMP/radar-restore"
