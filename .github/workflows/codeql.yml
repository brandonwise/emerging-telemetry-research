name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "39 5 * * 2"
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          output: codeql-results
          upload: never
          upload-database: false
      - name: Enforce CodeQL results
        shell: python
        run: |
          import json
          from pathlib import Path

          paths = sorted(Path("codeql-results").glob("*.sarif"))
          if not paths:
              raise SystemExit("CodeQL produced no SARIF results")
          findings = []
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              for run in payload.get("runs", []):
                  findings.extend(run.get("results", []))
          if findings:
              for finding in findings[:20]:
                  physical = (
                      (finding.get("locations") or [{}])[0]
                      .get("physicalLocation", {})
                  )
                  artifact = physical.get("artifactLocation", {})
                  region = physical.get("region", {})
                  message = finding.get("message", {}).get("text", "")
                  print(
                      f"{finding.get('ruleId', 'unknown-rule')} "
                      f"{artifact.get('uri', 'unknown-path')}:"
                      f"{region.get('startLine', '?')}: {message}"
                  )
              raise SystemExit(f"CodeQL reported {len(findings)} finding(s)")
          print(f"CodeQL completed with zero findings across {len(paths)} result file(s)")
