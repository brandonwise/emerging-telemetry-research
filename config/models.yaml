version: 1

budgets:
  daily_currency_soft_limit: 75.00
  daily_currency_hard_limit: 120.00
  flash_reserve_currency: 20.00
  per_run_currency_limit: 12.00
  per_cluster_currency_limit: 3.00
  max_promoted_clusters_per_hour: 25
  max_coordinator_clusters_per_cycle: 8

routes:
  deterministic:
    implementation: code
    tasks:
      - fetch
      - hash
      - deduplicate
      - normalize_identifiers
      - compute_features
      - score
      - validate_schema
      - render

  economical_extractor:
    provider_preferences:
      - provider: configured_low_cost_provider
        model: configured_structured_small_model
      - provider: fallback_low_cost_provider
        model: configured_structured_small_model
    max_input_tokens: 12000
    max_output_tokens: 1200
    temperature: 0
    json_schema_required: true
    tools: []
    retries: 1

  balanced_analyst:
    provider_preferences:
      - provider: configured_balanced_provider
        model: configured_balanced_model
      - provider: fallback_balanced_provider
        model: configured_balanced_model
    max_input_tokens: 24000
    max_output_tokens: 2500
    temperature: 0.1
    json_schema_required: true
    tools:
      - evidence.read
      - assessment.submit
    retries: 1

  chief_coordinator:
    provider_preferences:
      - provider: openai
        model: openai/gpt-5.6-sol
        harness: codex
        thinking: ultra
    max_input_tokens: 48000
    max_output_tokens: 4000
    temperature: 0.1
    json_schema_required: true
    tools:
      - evidence.read
      - prior_assessment.read
      - assessment.submit
    retries: 1
    promotion_rules:
      - priority_score_gte: 78
      - flash_candidate: true
      - specialist_disagreement: true
      - material_contradiction: true

fallback_behavior:
  coordinator_unavailable: hold_flash_and_publish_degraded_watch_only
  balanced_unavailable: deterministic_triage_only
  extractor_unavailable: queue_for_retry
  hard_budget_reached: preserve_flash_reserve_and_stop_noncritical_analysis

usage_dimensions:
  - run_id
  - workflow_step
  - source_id
  - agent_id
  - provider
  - model
  - finding_id
  - input_tokens
  - output_tokens
  - cached_tokens
  - tool_calls
  - latency_ms
  - estimated_currency
