services:
  research-api:
    image: emerging-telemetry-research:${ETR_IMAGE_TAG:-1.1.0rc1}
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["application"]
    user: "65532:65532"
    init: true
    read_only: true
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=65532,gid=65532
    volumes:
      - research_reports:/var/lib/telemetry-research/reports
    secrets:
      - research_api_database_url
    environment:
      ETR_API_DATABASE_URL_REF: file:///run/secrets/research_api_database_url
      ETR_API_MTLS_IDENTITIES_JSON: ${ETR_API_MTLS_IDENTITIES_JSON:-{}}
      ETR_API_TRUSTED_PROXY_IPS_JSON: ${ETR_API_TRUSTED_PROXY_IPS_JSON:-["127.0.0.1","::1"]}
      ETR_API_EXTERNAL_DELIVERY_ENABLED: "false"
    ports:
      - "127.0.0.1:${ETR_API_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${ETR_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - research_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${ETR_MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${ETR_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - research_minio:/data
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - research_grafana:/var/lib/grafana
    security_opt:
      - no-new-privileges:true

volumes:
  research_postgres:
  research_minio:
  research_grafana:
  research_reports:

secrets:
  research_api_database_url:
    environment: ETR_API_DATABASE_URL
