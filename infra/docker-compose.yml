services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${RADAR_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${RADAR_MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${RADAR_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - radar_minio:/data
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - radar_grafana:/var/lib/grafana
    security_opt:
      - no-new-privileges:true

volumes:
  radar_postgres:
  radar_minio:
  radar_grafana:
