groups:
  - name: telemetry-research
    rules:
      - alert: ThreatResearchWorkflowFailures
        expr: increase(research_workflow_runs_total{research_status="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Telemetry Research workflow failed
      - alert: ThreatResearchSourceDegraded
        expr: increase(research_source_fetches_total{research_status=~"degraded|failed"}[30m]) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Telemetry Research source is repeatedly degraded
      - alert: ThreatResearchModelFailures
        expr: increase(research_model_requests_total{research_status="failed"}[15m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telemetry Research model route is failing
      - alert: ThreatResearchDeliveryFailure
        expr: increase(research_delivery_attempts_total{research_status="failed"}[15m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Verified report delivery failed
      - alert: ThreatResearchCriticalContent
        expr: increase(research_security_events_total{research_risk="critical"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Critical hostile-content pattern blocked
